<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeliCuts Fresh Meat</title>
    <style>
        body { font-family: sans-serif; background: #F5F5F5; margin: 0; text-align: center; }
        header { background: #D32F2F; color: white; padding: 20px; font-size: 24px; font-weight: bold; }
        .card { background: white; margin: 20px auto; padding: 20px; max-width: 300px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #388E3C; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <header>🥩 DeliCuts Mobile Storefront</header>
    <div class="card">
        <h3>Fresh Chicken Breast</h3>
        <p>Net Weight: 500g</p>
        <p style="font-size: 20px; font-weight: bold; color: #D32F2F;">₹249</p>
        <button onclick="alert('Added to DeliCuts Basket!')">ADD TO CART</button>
    </div>
</body>
</html>
